name: Verify three public deployments
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python build.py
      - name: Check anonymous access and exact deployment bytes
        run: python verify_deployments.py
